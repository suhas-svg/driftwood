name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -count=5 ./sim/
      - run: go test -race -count=1 -timeout 30m ./raft/
      - run: go test -race -count=2 -timeout 20m -v ./kv/
